<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OT Calculator - Redbank Transport</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f4; min-height: 100vh; }
.app { padding: 1rem; max-width: 420px; margin: 0 auto; }
.header { background: #cc0000; color: white; padding: 1rem 1.25rem; border-radius: 12px; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }
.header i { font-size: 22px; }
.header h1 { font-size: 18px; font-weight: 700; color: white; }
.header p { font-size: 12px; opacity: 0.85; color: white; }
.tab-bar { display: flex; gap: 6px; margin-bottom: 1rem; }
.tab { flex: 1; padding: 8px; border: 0.5px solid #ddd; border-radius: 8px; background: white; color: #666; font-size: 13px; cursor: pointer; text-align: center; transition: all 0.15s; }
.tab.active { background: #cc0000; color: white; border-color: #cc0000; }
.section { display: none; }
.section.active { display: block; }
.card { background: white; border: 0.5px solid #ddd; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
.field-group { margin-bottom: 1rem; }
.field-label { font-size: 12px; color: #666; margin-bottom: 4px; display: block; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
input[type="date"], input[type="time"], input[type="text"] { width: 100%; padding: 8px 10px; border: 0.5px solid #ddd; border-radius: 8px; font-size: 14px; background: white; color: #222; }
textarea { width: 100%; padding: 8px 10px; border: 0.5px solid #ddd; border-radius: 8px; font-size: 14px; background: white; color: #222; resize: none; height: 70px; font-family: inherit; }
.result-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 0.5px solid #eee; }
.result-row:last-child { border-bottom: none; }
.result-label { font-size: 14px; font-weight: 500; color: #222; }
.result-value { font-size: 14px; font-weight: 500; color: #222; }
.result-value.highlight { color: #cc0000; font-size: 18px; font-weight: 700; }
.notice { background: #fff8e1; border: 0.5px solid #ffe082; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #f57f17; margin-top: 10px; display: none; }
.btn-save { width: 100%; padding: 14px; background: #cc0000; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-save:active { opacity: 0.85; }
.record { background: white; border: 0.5px solid #ddd; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 10px; }
.record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.record-date { font-size: 14px; font-weight: 500; color: #222; }
.record-total { font-size: 15px; font-weight: 700; color: #cc0000; }
.record-detail { font-size: 12px; color: #666; }
.record-actions { display: flex; gap: 6px; margin-top: 10px; }
.btn-delete { padding: 6px 12px; border: 0.5px solid #ffcdd2; border-radius: 8px; background: transparent; color: #c62828; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.empty-state { text-align: center; padding: 2rem 1rem; color: #999; font-size: 14px; }
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
.summary-card { background: #f8f8f8; border-radius: 8px; padding: 0.75rem 1rem; }
.summary-label { font-size: 11px; color: #666; margin-bottom: 4px; }
.summary-value { font-size: 20px; font-weight: 500; color: #222; }
.summary-value.red { color: #cc0000; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
.toast.show { opacity: 1; }
@media (prefers-color-scheme: dark) {
  body { background: #1a1a1a; }
  .card, .record { background: #2a2a2a; border-color: #444; }
  .tab { background: #2a2a2a; border-color: #444; color: #aaa; }
  input[type="date"], input[type="time"], input[type="text"], textarea { background: #2a2a2a; border-color: #444; color: #eee; }
  .result-label, .record-date { color: #eee; }
  .result-value { color: #eee; }
  .result-row { border-color: #444; }
  .summary-card { background: #333; }
  .summary-value { color: #eee; }
  .field-label, .record-detail, .summary-label { color: #aaa; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <i class="ti ti-clock-hour-4"></i>
    <div>
      <h1>OT Calculator</h1>
      <p>Redbank Transport</p>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active" onclick="switchTab('entry', event)"><i class="ti ti-plus"></i> Entry</div>
    <div class="tab" onclick="switchTab('history', event)"><i class="ti ti-list"></i> History</div>
    <div class="tab" onclick="switchTab('summary', event)"><i class="ti ti-chart-bar"></i> Summary</div>
  </div>

  <div id="entry" class="section active">
    <div class="card">
      <div class="field-group">
        <label class="field-label">Date</label>
        <input type="date" id="date" />
      </div>
      <div class="field-group">
        <label class="field-label">Duty time (rostered)</label>
        <div class="field-row">
          <div>
            <label class="field-label">Start</label>
            <input type="time" id="dutyStart" />
          </div>
          <div>
            <label class="field-label">Finish</label>
            <input type="time" id="dutyFinish" />
          </div>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Actual time</label>
        <div class="field-row">
          <div>
            <label class="field-label">Start</label>
            <input type="time" id="actualStart" />
          </div>
          <div>
            <label class="field-label">Finish</label>
            <input type="time" id="actualFinish" />
          </div>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Notes</label>
        <textarea id="notes" placeholder="Optional notes...ex) Duty135, XV432-5208. Heavy Traffics due to incident....."></textarea>
      </div>
    </div>

    <div class="card">
      <div class="result-row">
        <span class="result-label">Rostered OT</span>
        <span class="result-value" id="rosteredOT">--:--</span>
      </div>
      <div class="result-row">
        <span class="result-label">Additional OT</span>
        <span class="result-value" id="additionalOT">--:--</span>
      </div>
      <div class="result-row">
        <span class="result-label">Total OT</span>
        <span class="result-value highlight" id="totalOT">--:--</span>
      </div>
      <div class="notice" id="notice">⚠️ Second meal break has been applied.</div>
    </div>

    <button class="btn-save" onclick="saveEntry()">
      <i class="ti ti-device-floppy"></i> Save entry
    </button>
  </div>

  <div id="history" class="section">
    <div id="history-list"></div>
  </div>

  <div id="summary" class="section">
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-label">Total entries</div>
        <div class="summary-value" id="totalEntries">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Total OT</div>
        <div class="summary-value red" id="totalOTHours">0:00</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Rostered OT</div>
        <div class="summary-value" id="totalRostered">0:00</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Additional OT</div>
        <div class="summary-value" id="totalAdditional">0:00</div>
      </div>
    </div>
    <div id="summary-entries"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const today = new Date().toISOString().split('T')[0];
document.getElementById('date').value = today;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
function parseTime(str) {
  if (!str) return null;
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}
function minsToHHMM(mins) {
  if (mins < 0) mins = 0;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h + ':' + String(m).padStart(2, '0');
}
function calcOT(dutyStart, dutyFinish, actualStart, actualFinish) {
  let ds = parseTime(dutyStart), df = parseTime(dutyFinish);
  let as_ = parseTime(actualStart), af = parseTime(actualFinish);
  if (df < ds) df += 1440;
  if (af < as_) af += 1440;
  const STANDARD = 7 * 60 + 51;
  const dutyDuration = df - ds;
  const actualDuration = af - as_;
  const rosteredOT = Math.max(0, dutyDuration - STANDARD);
  const mealDeduction = actualDuration > 630 ? 30 : 0;
  const additionalOT = Math.max(0, actualDuration - dutyDuration - mealDeduction);
  const totalOT = rosteredOT + additionalOT;
  return { rosteredOT, additionalOT, totalOT, mealDeduction };
}
function updateCalc() {
  const ds = document.getElementById('dutyStart').value;
  const df = document.getElementById('dutyFinish').value;
  const as_ = document.getElementById('actualStart').value;
  const af = document.getElementById('actualFinish').value;
  if (!ds || !df || !as_ || !af) return;
  const r = calcOT(ds, df, as_, af);
  document.getElementById('rosteredOT').textContent = minsToHHMM(r.rosteredOT);
  document.getElementById('additionalOT').textContent = minsToHHMM(r.additionalOT);
  document.getElementById('totalOT').textContent = minsToHHMM(r.totalOT);
  document.getElementById('notice').style.display = r.mealDeduction > 0 ? 'block' : 'none';
}
['dutyStart','dutyFinish','actualStart','actualFinish'].forEach(id => {
  document.getElementById(id).addEventListener('change', updateCalc);
});
function getEntries() {
  try { return JSON.parse(localStorage.getItem('ot_entries') || '[]'); } catch(e) { return []; }
}
function saveEntries(e) { localStorage.setItem('ot_entries', JSON.stringify(e)); }
function saveEntry() {
  const date = document.getElementById('date').value;
  const ds = document.getElementById('dutyStart').value;
  const df = document.getElementById('dutyFinish').value;
  const as_ = document.getElementById('actualStart').value;
  const af = document.getElementById('actualFinish').value;
  const notes = document.getElementById('notes').value;
  if (!date || !ds || !df || !as_ || !af) {
    showToast('Please fill in all fields.');
    return;
  }
  const existing = getEntries();
  if (existing.some(e => e.date === date)) {
    showToast('⚠️ Entry for this date already exists!');
    return;
  }
  const r = calcOT(ds, df, as_, af);
  const entry = { id: Date.now(), date, dutyStart: ds, dutyFinish: df, actualStart: as_, actualFinish: af, notes, rosteredOT: r.rosteredOT, additionalOT: r.additionalOT, totalOT: r.totalOT, mealDeduction: r.mealDeduction };
  existing.unshift(entry);
  saveEntries(existing);
  document.getElementById('date').value = today;
  document.getElementById('dutyStart').value = '';
  document.getElementById('dutyFinish').value = '';
  document.getElementById('actualStart').value = '';
  document.getElementById('actualFinish').value = '';
  document.getElementById('notes').value = '';
  document.getElementById('rosteredOT').textContent = '--:--';
  document.getElementById('additionalOT').textContent = '--:--';
  document.getElementById('totalOT').textContent = '--:--';
  document.getElementById('notice').style.display = 'none';
  showToast('✅ Entry saved!');
}
function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  saveEntries(getEntries().filter(e => e.id !== id));
  renderHistory();
  renderSummary();
}
function renderHistory() {
  const entries = getEntries();
  const el = document.getElementById('history-list');
  if (!entries.length) {
    el.innerHTML = '<div class="empty-state"><i class="ti ti-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>No entries yet</div>';
    return;
  }
  el.innerHTML = entries.map(e => `
    <div class="record">
      <div class="record-header">
        <span class="record-date">${e.date}</span>
        <span class="record-total">${minsToHHMM(e.totalOT)} OT</span>
      </div>
      <div class="record-detail">Duty: ${e.dutyStart} – ${e.dutyFinish} &nbsp;|&nbsp; Actual: ${e.actualStart} – ${e.actualFinish}</div>
      <div class="record-detail" style="margin-top:4px">Rostered: ${minsToHHMM(e.rosteredOT)} &nbsp;|&nbsp; Additional: ${minsToHHMM(e.additionalOT)}${e.mealDeduction ? ' &nbsp;⚠️ 2nd meal' : ''}</div>
      ${e.notes ? `<div class="record-detail" style="margin-top:4px;font-style:italic">${e.notes}</div>` : ''}
      <div class="record-actions">
        <button class="btn-delete" onclick="deleteEntry(${e.id})"><i class="ti ti-trash"></i> Delete</button>
      </div>
    </div>
  `).join('');
}
function renderSummary() {
  const entries = getEntries();
  document.getElementById('totalEntries').textContent = entries.length;
  document.getElementById('totalOTHours').textContent = minsToHHMM(entries.reduce((s, e) => s + e.totalOT, 0));
  document.getElementById('totalRostered').textContent = minsToHHMM(entries.reduce((s, e) => s + e.rosteredOT, 0));
  document.getElementById('totalAdditional').textContent = minsToHHMM(entries.reduce((s, e) => s + e.additionalOT, 0));
  const el = document.getElementById('summary-entries');
  if (!entries.length) { el.innerHTML = '<div class="empty-state">No data yet</div>'; return; }
  el.innerHTML = entries.map(e => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid #eee">
      <span style="font-size:13px;color:#666">${e.date}</span>
      <span style="font-size:14px;font-weight:700;color:#cc0000">${minsToHHMM(e.totalOT)}</span>
    </div>
  `).join('');
}
function switchTab(tab, event) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  event.target.closest('.tab').classList.add('active');
  document.getElementById(tab).classList.add('active');
  if (tab === 'history') renderHistory();
  if (tab === 'summary') renderSummary();
}
renderHistory();
</script>
</body>
</html>
